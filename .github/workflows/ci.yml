name: Runtime and security
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
        include:
          - os: macos-14
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      RUN_BROWSER_TESTS: 'true'
      # Ubuntu AppArmor disables unprivileged namespaces. This applies only to
      # Chromium fixture tests, never to the production WhatsApp browser.
      MCP_TEST_NO_SANDBOX: ${{ matrix.os == 'ubuntu-latest' && 'true' || 'false' }}
      LOG_LEVEL: error
      LOG_STDERR_LEVEL: error
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:package
      - run: npm audit --omit=dev
